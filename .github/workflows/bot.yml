name: cripto-bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: cripto-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Un ciclo del bot
        env:
          MODE: ${{ vars.MODE || 'paper' }}
          SYMBOL: ${{ vars.SYMBOL || 'BTC/USDT' }}
          START_BALANCE: ${{ vars.START_BALANCE || '100' }}
          THRESHOLD: ${{ vars.THRESHOLD || '0.62' }}
          POSITION_PCT: ${{ vars.POSITION_PCT || '0.25' }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT || '0.02' }}
          TAKE_PROFIT_PCT: ${{ vars.TAKE_PROFIT_PCT || '0.03' }}
          MAX_HOLD_HOURS: ${{ vars.MAX_HOLD_HOURS || '12' }}
          KILL_SWITCH_BALANCE: ${{ vars.KILL_SWITCH_BALANCE || '70' }}
          MIN_SECONDS_BETWEEN_TRADES: ${{ vars.MIN_SECONDS_BETWEEN_TRADES || '1800' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          MODEL: ${{ vars.MODEL || 'llama-3.3-70b-versatile' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.main --once

      - name: Guardar estado en el repo
        if: always()
        run: |
          git config user.name "cripto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.db KILLED 2>/dev/null || git add ledger.db
          git diff --cached --quiet || git commit -m "tick $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
